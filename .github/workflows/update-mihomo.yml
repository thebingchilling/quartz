name: update-mihomo

# A failed check pushes nothing and leaves a report for an agent to adapt core/.
on:
  workflow_dispatch:
    inputs:
      version:
        description: mihomo release tag, e.g. v1.19.33 (empty for the latest)
        required: false

permissions:
  contents: write
  actions: write

env:
  GO_VERSION: '1.27.1'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Pick the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          version="$REQUESTED"
          if [ -z "$version" ]; then
            version=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq .tag_name)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bump mihomo
        working-directory: core
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go get "github.com/metacubex/mihomo@$VERSION"
          go mod tidy
          sed -i "s/^core_version: .*/core_version: $VERSION/" ../build_config.yaml

      - name: Check the Core still builds
        id: checks
        working-directory: core
        run: |
          mkdir -p ../checks
          check() {
            local name="$1"
            shift
            if ! env "$@" > "../checks/$name.log" 2>&1; then
              echo "$name|$*" >> ../checks/failed.txt
            fi
          }
          check stock-mihomo sh -c '! grep -E "^replace|=>" go.mod && test ! -d vendor'
          check linux-vet CGO_ENABLED=0 go vet . ./cmd/...
          check linux-test CGO_ENABLED=0 go test .
          check android-vet GOOS=android GOARCH=arm64 CGO_ENABLED=0 go vet -tags=with_gvisor,cmfa . ./mobile ./tun ./platform
          check windows-vet GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet . ./cmd/...
          if [ -f ../checks/failed.txt ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the failure report
        if: steps.checks.outputs.failed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          previous=$(git show HEAD:build_config.yaml | sed -n 's/^core_version: //p')
          {
            echo "# mihomo $VERSION breaks the Quartz Core"
            echo
            echo "The update-mihomo workflow moved \`core/go.mod\` from mihomo $previous to $VERSION and these checks failed ($RUN_URL)."
            echo
            echo "Quartz stays on mihomo $previous; nothing was pushed."
            echo
            echo "Task for the agent: adapt FlClash's wrapper in \`core/\` to the mihomo $VERSION API so every check below"
            echo "passes. mihomo itself must stay identical to the upstream release (AGENTS.md): no fork, \`replace\`, vendoring"
            echo "or patch. Bump with \`cd core && go get github.com/metacubex/mihomo@$VERSION && go mod tidy\`, set"
            echo "\`core_version: $VERSION\` in \`build_config.yaml\`, then commit to \`main\`."
            echo
            while IFS='|' read -r name command; do
              echo "## $name"
              echo
              echo "\`cd core && $command\`"
              echo
              echo '```'
              grep -E -e '--- FAIL|^FAIL|panic:|\.go:[0-9]+' "checks/$name.log" | head -n 60 || true
              echo '```'
              echo
              echo '<details><summary>Full output (last 150 lines)</summary>'
              echo
              echo '```'
              tail -n 150 "checks/$name.log"
              echo '```'
              echo
              echo '</details>'
              echo
            done < checks/failed.txt
          } > mihomo-update-report.md
          cat mihomo-update-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: steps.checks.outputs.failed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-update-report
          path: |
            mihomo-update-report.md
            checks/

      - name: Stop on failed checks
        if: steps.checks.outputs.failed == 'true'
        run: exit 1

      - name: Commit and build a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "Already on mihomo $VERSION"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "build(core): mihomo $VERSION" -m "Changelog: The engine is updated to mihomo $VERSION"
          git push origin HEAD:main
          # A push made with the workflow token starts no other workflow.
          gh workflow run quartz-clash.yml --ref main
