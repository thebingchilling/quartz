name: quartz-release

# Runs on pushes to main that change Quartz's own app files (everything under
# quartz/: quartz/android, quartz/windows) and when started by hand. Docs,
# workflow files and upstream's folders (app/, desktop/) don't start it. A
# commit message with [skip ci] skips the build. Every run builds both apps
# from main and publishes one dual release: the Android APKs and the Windows
# installer in a single GitHub release, e.g. quartz-5.8.2-desktop-2.4.1 (-2,
# -3, … for further builds on the same bases). A newer push cancels a
# push-triggered build that hasn't finished, to save Actions minutes.
#
# "update" (off by default) first brings in upstream resources, and is the only
# thing that does:
#  - a new wgtunnel/android release is merged into main, a new wgtunnel/desktop
#    release is subtree-merged into desktop/; a conflicting merge opens a PR
#    (Android) or an issue (desktop) and nothing is released until it's fixed;
#  - new openvpn3 / mihomo releases get submodule bump PRs (no release).
# Without it the run only builds what's on main.
#
# Tags start with "quartz-" so they never trigger upstream's publish.yml.
# Releases are public and marked latest (the desktop updater reads the latest
# release's latest.yml). Until signing is set up, Android is debug-signed with
# the committed key (fdroid flavor, no in-app updater) and the Windows
# installer is unsigned.

on:
  push:
    branches: [main]
    paths: ["quartz/**"]
  workflow_dispatch:
    inputs:
      update:
        type: boolean
        description: "Update first: merge new WG Tunnel Android/Desktop releases, open engine bump PRs"
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: quartz-release
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.done.outputs.sha }}
      release: ${{ steps.release.outputs.release }}
      android_tag: ${{ steps.versions.outputs.android }}
      desktop_version: ${{ steps.versions.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # Upstream merges often touch .github/workflows, which GITHUB_TOKEN
          # can't push. SYNC_TOKEN is a PAT with repo + workflow scope.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Set up git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/wgtunnel/android.git
          git remote add upstream-desktop https://github.com/wgtunnel/desktop.git

      # Prints the next free release name for $1 (e.g. quartz-android-5.8.3),
      # or nothing if it exists and $2 (force) isn't "true".
      - name: Release name helper
        run: |
          cat > "$RUNNER_TEMP/next-release.sh" <<'EOF'
          base=$1; force=$2
          if ! gh release view "$base" >/dev/null 2>&1; then echo "$base"; exit 0; fi
          [ "$force" = "true" ] || exit 0
          n=2; while gh release view "$base-$n" >/dev/null 2>&1; do n=$((n+1)); done
          echo "$base-$n"
          EOF
          chmod +x "$RUNNER_TEMP/next-release.sh"

      - name: WG Tunnel Android
        id: android
        if: inputs.update
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          tag=$(git ls-remote --tags upstream | grep -v '\^{}' | sed 's#.*refs/tags/##' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Latest WG Tunnel Android: $tag"

          git fetch --no-tags upstream "refs/tags/$tag:refs/tags/upstream-$tag"
          if ! git merge-base --is-ancestor "upstream-$tag" HEAD; then
            merged=false
            if git merge --no-edit -m "Merge WG Tunnel $tag" "upstream-$tag"; then
              merged=true
            else
              # Files Quartz deleted (e.g. .github/dependabot.yml) that upstream
              # changed: keep them deleted. Any other conflict needs a person.
              git diff --name-only --diff-filter=U -z | while IFS= read -r -d '' f; do
                if [ "$(git status --porcelain -- "$f" | cut -c1-2)" = "DU" ]; then git rm -q -- "$f"; fi
              done
              if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                git commit --no-edit -q
                merged=true
              fi
            fi
            if $merged; then
              git push origin HEAD:main
            else
              git merge --abort
              branch="upstream-$tag"
              git push --force origin "refs/tags/upstream-$tag:refs/heads/$branch"
              if [ -z "$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')" ]; then
                gh pr create --head "$branch" --base main --title "Merge WG Tunnel $tag" --body "Merging [WG Tunnel $tag](https://github.com/wgtunnel/android/releases/tag/$tag) into main hit conflicts. The next Quartz release is published by the first run after this is merged.

          Resolve locally (merge, never rebase), then push to main:

          \`\`\`bash
          git fetch upstream tag $tag && git merge $tag
          \`\`\`

          Check the touched-files list in FORK.md §11."
              fi
              echo "::warning::Conflicts merging WG Tunnel $tag; opened a PR"
              echo "conflict=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: WG Tunnel Desktop
        id: desktop
        if: inputs.update
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          tag=$(git ls-remote --tags upstream-desktop | grep -v '\^{}' | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          version=${tag#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest WG Tunnel Desktop: $tag"

          # Last desktop tag merged, from git subtree's squash commit metadata.
          current=$(git log -1 --grep='^git-subtree-dir: desktop$' --format=%B \
            | sed -n 's/^git-subtree-split: //p')
          git fetch --no-tags upstream-desktop "refs/tags/$tag:refs/tags/desktop-$tag"
          if [ "$(git rev-parse "desktop-$tag^{commit}")" != "$current" ]; then
            if ! git subtree pull --prefix=desktop --squash upstream-desktop "refs/tags/$tag" \
                -m "Merge WG Tunnel Desktop $tag into desktop/"; then
              git merge --abort || true
              title="Merge WG Tunnel Desktop $tag"
              if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
                gh issue create --title "$title" --body "Subtree-merging [WG Tunnel Desktop $tag](https://github.com/wgtunnel/desktop/releases/tag/$tag) into \`desktop/\` hit conflicts. The next Quartz release is published by the first run after this is merged.

          Resolve locally, then push to main:

          \`\`\`bash
          git remote add upstream-desktop https://github.com/wgtunnel/desktop.git
          git subtree pull --prefix=desktop --squash upstream-desktop refs/tags/$tag
          \`\`\`

          Check the touched-files list in FORK.md §11."
              fi
              echo "::warning::Conflicts merging WG Tunnel Desktop $tag; opened an issue"
              echo "conflict=true" >> "$GITHUB_OUTPUT"
            else
              git push origin HEAD:main
            fi
          fi

      # The bases as they are on main now (after any merge above).
      - name: Current versions
        id: versions
        run: |
          echo "android=$(sed -nE 's/^versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
          echo "desktop=$(sed -nE 's/^app[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' desktop/gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      # One release for both apps, named after both bases. Nothing is released
      # while either merge waits on a person.
      - name: Release name
        id: release
        if: steps.android.outputs.conflict != 'true' && steps.desktop.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          release=$("$RUNNER_TEMP/next-release.sh" \
            "quartz-${{ steps.versions.outputs.android }}-desktop-${{ steps.versions.outputs.desktop }}" true)
          echo "Release: ${release:-none}"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Engines
        if: inputs.update
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          [ -f .gitmodules ] || { echo "No engines yet"; exit 0; }
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | while read -r key path; do
            case "$path" in quartz/android/engines/*) ;; *) continue ;; esac
            name=$(basename "$path")
            url=$(git config -f .gitmodules --get "${key%.path}.url")
            pinned=$(git ls-tree HEAD "$path" | awk '{print $3}')
            latest=$(git ls-remote --tags "$url" | grep -v '\^{}' | sed 's#.*refs/tags/##' \
              | grep -E '^v?[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -1)
            [ -n "$latest" ] || continue
            latest_sha=$(git ls-remote "$url" "refs/tags/$latest^{}" "refs/tags/$latest" | head -1 | awk '{print $1}')
            [ "$latest_sha" != "$pinned" ] || { echo "$name is up to date ($latest)"; continue; }
            branch="engine-$name-$latest"
            git ls-remote --exit-code --heads origin "$branch" >/dev/null && { echo "$branch already open"; continue; }
            echo "Bumping $name to $latest"
            git submodule update --init "$path"
            git -C "$path" fetch --depth 1 origin "refs/tags/$latest:refs/tags/$latest"
            git -C "$path" checkout -q "$latest"
            git switch -q -c "$branch"
            # quartz/android/engines/versions.properties records the pinned release for the app.
            sed -i "s#^$name=.*#$name=$latest#" quartz/android/engines/versions.properties
            grep -q "^$name=" quartz/android/engines/versions.properties || echo "$name=$latest" >> quartz/android/engines/versions.properties
            git commit -qm "Bump $name engine to $latest" "$path" quartz/android/engines/versions.properties
            git push -q origin "$branch"
            gh pr create --head "$branch" --base main --title "Bump $name engine to $latest" \
              --body "New $name release: $latest. Check \`quartz/android/engines/patches/$name\` still apply. Merging this doesn't publish a release; it ships with the next quartz-release build."
            git switch -q main
          done

      - name: Record commit
        id: done
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    needs: sync
    if: needs.sync.outputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.sha }}
          submodules: recursive

      - name: Read JDK version
        id: jdk
        run: echo "version=$(sed -nE 's/^jdk[[:space:]]*=[[:space:]]*"([0-9]+)".*/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}
          cache: gradle

      # mihomo engine (FORK.md §3): Go + the NDK pinned in quartz.gradle. The built .so files
      # are cached by submodule commit + wrapper, so an unchanged engine isn't rebuilt.
      - uses: actions/setup-go@v7
        with:
          go-version-file: quartz/android/engine-mihomo/go/go.mod
          cache-dependency-path: quartz/android/engine-mihomo/go/go.sum

      - name: Engine cache key
        id: engines
        run: |
          echo "ndk=$(sed -nE 's/^def quartzNdkVersion = "([^"]+)"/\1/p' quartz/android/quartz.gradle)" >> "$GITHUB_OUTPUT"
          echo "mihomo=$(git rev-parse HEAD:quartz/android/engines/mihomo)" >> "$GITHUB_OUTPUT"

      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ steps.engines.outputs.ndk }}" > /dev/null

      - uses: actions/cache@v5
        with:
          path: app/build/generated/quartz/jniLibs
          key: mihomo-${{ steps.engines.outputs.mihomo }}-${{ hashFiles('quartz/android/engine-mihomo/go/**') }}-ndk${{ steps.engines.outputs.ndk }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFdroidDebug --stacktrace
          mkdir -p dist
          for f in app/build/outputs/apk/fdroid/debug/*.apk; do
            cp "$f" "dist/$(basename "$f" | sed 's/^wgtunnel-/quartz-/')"
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*.apk
          retention-days: 1

  windows:
    needs: sync
    if: needs.sync.outputs.release != ''
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.sha }}
          path: quartz
          submodules: recursive

      # Same toolchain as upstream desktop's package-windows.yml.
      - uses: actions/checkout@v7
        with:
          repository: NucleusFramework/Nucleus
          ref: main
          path: Nucleus

      - uses: ./Nucleus/.github/actions/setup-nucleus
        with:
          java-version: "25"
          setup-gradle: "true"
          setup-node: "true"
          graalvm: "true"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "7.0.x"

      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64

      - name: Package NSIS (GraalVM)
        working-directory: quartz/desktop
        env:
          WGTUNNEL_VARIANT: release
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew :composeApp:packageGraalvmNsis --no-daemon --stacktrace "-Papp.variant=release" "-Papp.version=${{ needs.sync.outputs.desktop_version }}" "-Papp.packageVersion=${{ needs.sync.outputs.desktop_version }}"

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist
          find quartz/desktop/composeApp/build/compose/binaries -type f \
            \( -name '*.exe' -o -name '*.yml' -o -name '*.blockmap' \) \
            ! -name 'wgtunnel-daemon.exe' ! -name 'service-wrapper.exe' -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          retention-days: 1

  publish:
    needs: [sync, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.sync.outputs.release }}
          TAG: ${{ needs.sync.outputs.android_tag }}
          VERSION: ${{ needs.sync.outputs.desktop_version }}
        run: |
          ls -l dist
          suffix=${RELEASE#quartz-$TAG-desktop-$VERSION}
          gh release create "$RELEASE" dist/* \
            --target "${{ needs.sync.outputs.sha }}" \
            --title "Quartz $TAG$suffix · Desktop $VERSION" \
            --notes "One release, both apps, from the same commit.

          **Android**, built on [WG Tunnel $TAG](https://github.com/wgtunnel/android/releases/tag/$TAG): public debug build, signed with Quartz's committed debug key so every Quartz build installs over the last one (fdroid flavor, no in-app updater). Install the \`arm64\` APK on most phones, \`armv7\` on older ones, or \`universal\` if unsure.

          **Windows**, built on [WG Tunnel Desktop v$VERSION](https://github.com/wgtunnel/desktop/releases/tag/v$VERSION): unsigned installer, so Windows SmartScreen will warn on install (More info → Run anyway). The desktop app updates itself from these releases."
