name: quartz-monthly

# Once a month: merge wgtunnel/android master into main, build Quartz and
# publish it as a GitHub release. If the merge conflicts, the upstream
# changes go to a PR instead and no release is made until it's resolved
# (resolve locally with `git merge upstream/master`, never rebase).
#
# Builds the fdroid flavor: standalone's in-app updater still points at
# wgtunnel/android releases. Debug-signed with signing/quartz-debug.jks and
# marked pre-release until release signing is set up.

on:
  schedule:
    - cron: "23 4 1 * *" # 1st of each month, 04:23 UTC
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        description: "Build and publish a release after syncing"
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: quartz-monthly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # Upstream merges often touch .github/workflows, which GITHUB_TOKEN
          # can't push. SYNC_TOKEN is a PAT with repo + workflow scope.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/wgtunnel/android.git
          git fetch --no-tags upstream master

      - name: Merge upstream into main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "main already contains upstream/master"
            exit 0
          fi
          count=$(git rev-list --count HEAD..upstream/master)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge --no-edit -m "Merge upstream WG Tunnel ($count commits)" upstream/master; then
            git push origin HEAD:main
            exit 0
          fi
          git merge --abort
          git push --force origin upstream/master:refs/heads/upstream-master
          body="Monthly sync hit conflicts merging ${count} commit(s) from [wgtunnel/android](https://github.com/wgtunnel/android) master. No release is made until this is merged.

          Resolve locally, then push to main:

          \`\`\`bash
          git fetch upstream master && git merge upstream/master
          \`\`\`

          Check the touched-files list in FORK.md §11 when resolving."
          existing=$(gh pr list --head upstream-master --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
          else
            gh pr create --head upstream-master --base main --title "Merge upstream WG Tunnel" --body "$body"
          fi
          echo "::error::Upstream merge conflicts; opened a PR instead"
          exit 1

      - name: Record commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: sync
    if: github.event_name == 'schedule' || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Read versions
        id: ver
        run: |
          jdk=$(sed -nE 's/^jdk[[:space:]]*=[[:space:]]*"([0-9]+)".*/\1/p' gradle/libs.versions.toml)
          upstream=$(sed -nE 's/^versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml)
          month=$(date -u +%Y.%m)
          echo "jdk=$jdk" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "tag=quartz-$month" >> "$GITHUB_OUTPUT"
          echo "name=Quartz $month (WG Tunnel $upstream)" >> "$GITHUB_OUTPUT"

      - name: Skip if this month is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.ver.outputs.tag }} already exists; delete it to rebuild"
          fi

      - uses: actions/setup-java@v6
        if: steps.exists.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: ${{ steps.ver.outputs.jdk }}
          cache: gradle

      - name: Build
        if: steps.exists.outputs.skip != 'true'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFdroidDebug --stacktrace
          mkdir -p dist
          for f in app/build/outputs/apk/fdroid/debug/*.apk; do
            cp "$f" "dist/$(basename "$f" | sed 's/^wgtunnel-/quartz-/')"
          done
          ls -l dist

      - name: Publish release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" dist/*.apk \
            --target "${{ needs.sync.outputs.sha }}" \
            --title "${{ steps.ver.outputs.name }}" \
            --prerelease \
            --notes "Monthly Quartz build on WG Tunnel ${{ steps.ver.outputs.upstream }}.

          Debug-signed pre-release (fdroid flavor, no in-app updater). Install the \`arm64\` APK on most phones, \`armv7\` on older ones, or \`universal\` if unsure."
