name: quartz-clash

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'site/**'
      - 'snapshots/**'
  workflow_dispatch:

concurrency:
  group: quartz-clash
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
            arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Release signing stays off: it also uploads crash symbols to Firebase.
      - name: Android debug key
        if: matrix.platform == 'android'
        run: |
          mkdir -p ~/.android
          cp .github/signing/debug.keystore ~/.android/debug.keystore

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch || 'all' }}
          workspaces: services/helper
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6

      - name: Enable git long paths
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart ${{ matrix.platform }} --env pre -v

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: clash-${{ matrix.platform }}
          path: ./dist
          retention-days: 1
          overwrite: true

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          pattern: clash-*
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="quartz-flclash-0.9.0-${{ github.run_number }}"
          (cd dist && sha256sum ./* > SHA256SUMS)
          gh release create "$tag" dist/* \
            --target "${{ github.sha }}" \
            --title "Quartz $tag" \
            --latest \
            --notes "Quartz (FlClash v0.9.0 on stock mihomo), built from \`main\` at ${{ github.sha }}. Android APKs and the Windows installer, debug-signed."
