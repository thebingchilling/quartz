// Quartz overrides on top of upstream WG Tunnel's app/build.gradle.kts.
//
// Applied by a single line at the end of app/build.gradle.kts, so upstream's
// own config stays untouched and merges cleanly. Groovy rather than Kotlin
// script: an applied .gradle.kts can't see AGP's types, Groovy resolves the
// android extension dynamically.
//
// namespace stays upstream's (com.zaneschepke.wireguardautotunnel): it is the
// package of R and BuildConfig, not the installed app ID.

def quartzId = "app.quartz"
def quartzName = "Quartz"
def quartzAuthority = "app.quartz.provider"

android {
    defaultConfig {
        applicationId = quartzId
    }

    // Committed debug key, so every debug build (local or CI) has the same
    // signature and installs over the last one. Debug only: never release.
    signingConfigs {
        quartzDebug {
            storeFile = rootProject.file("signing/quartz-debug.jks")
            storePassword = "android"
            keyAlias = "quartzdebug"
            keyPassword = "android"
        }
    }

    buildTypes {
        // resValue at build-type level overrides app_name from main's strings.xml,
        // as upstream's debug/nightly already rely on.
        release {
            resValue("string", "app_name", quartzName)
            manifestPlaceholders["providerAuthority"] = quartzAuthority
            buildConfigField("String", "FILE_PROVIDER_AUTHORITY", "\"${quartzAuthority}\"")
        }
        debug {
            signingConfig = signingConfigs.quartzDebug
            resValue("string", "app_name", "${quartzName} Debug")
            manifestPlaceholders["providerAuthority"] = "${quartzAuthority}.debug"
            buildConfigField("String", "FILE_PROVIDER_AUTHORITY", "\"${quartzAuthority}.debug\"")
        }
        nightly {
            resValue("string", "app_name", "${quartzName} Nightly")
            manifestPlaceholders["providerAuthority"] = "${quartzAuthority}.nightly"
            buildConfigField("String", "FILE_PROVIDER_AUTHORITY", "\"${quartzAuthority}.nightly\"")
        }
    }
}

// Branding overlay (fork/branding/res): Quartz's icon, TV banner and notification glyph
// replace WG Tunnel's by resource name. Added to every flavor+build-type source set, the
// highest-priority ones, so they win over main and over upstream's nightly and debug icons
// without touching upstream's files.
android {
    sourceSets {
        ["fdroid", "google", "standalone"].each { flavor ->
            ["debug", "release", "nightly"].each { type ->
                maybeCreate(flavor + type.capitalize()).res.directories.add("$rootDir/fork/branding/res")
            }
        }
    }
}

// Upstream adds LeakCanary to debug builds, which puts a separate "Leaks" icon in the
// launcher. Quartz ships debug builds for now, so leave it out.
configurations.configureEach {
    exclude group: "com.squareup.leakcanary"
}
