// Quartz overrides on top of upstream WG Tunnel's app/build.gradle.kts.
//
// Applied by a single line at the end of app/build.gradle.kts, so upstream's
// own config stays untouched and merges cleanly. Groovy rather than Kotlin
// script: an applied .gradle.kts can't see AGP's types, Groovy resolves the
// android extension dynamically.
//
// namespace stays upstream's (com.zaneschepke.wireguardautotunnel): it is the
// package of R and BuildConfig, not the installed app ID.

def quartzId = "app.quartz"
def quartzName = "Quartz"
def quartzAuthority = "app.quartz.provider"

android {
    defaultConfig {
        applicationId = quartzId
    }

    // Committed debug key, so every debug build (local or CI) has the same
    // signature and installs over the last one. Debug only: never release.
    signingConfigs {
        quartzDebug {
            storeFile = rootProject.file("quartz/android/signing/quartz-debug.jks")
            storePassword = "android"
            keyAlias = "quartzdebug"
            keyPassword = "android"
        }
    }

    buildTypes {
        // resValue at build-type level overrides app_name from main's strings.xml,
        // as upstream's debug/nightly already rely on.
        release {
            resValue("string", "app_name", quartzName)
            manifestPlaceholders["providerAuthority"] = quartzAuthority
            buildConfigField("String", "FILE_PROVIDER_AUTHORITY", "\"${quartzAuthority}\"")
        }
        debug {
            signingConfig = signingConfigs.quartzDebug
            resValue("string", "app_name", "${quartzName} Debug")
            manifestPlaceholders["providerAuthority"] = "${quartzAuthority}.debug"
            buildConfigField("String", "FILE_PROVIDER_AUTHORITY", "\"${quartzAuthority}.debug\"")
        }
        nightly {
            resValue("string", "app_name", "${quartzName} Nightly")
            manifestPlaceholders["providerAuthority"] = "${quartzAuthority}.nightly"
            buildConfigField("String", "FILE_PROVIDER_AUTHORITY", "\"${quartzAuthority}.nightly\"")
        }
    }
}

// Branding overlay (quartz/android/branding/res): Quartz's icon, TV banner and notification glyph
// replace WG Tunnel's by resource name. Added to every flavor+build-type source set, the
// highest-priority ones, so they win over main and over upstream's nightly and debug icons
// without touching upstream's files.
android {
    sourceSets {
        ["fdroid", "google", "standalone"].each { flavor ->
            ["debug", "release", "nightly"].each { type ->
                maybeCreate(flavor + type.capitalize()).res.directories.add("$rootDir/quartz/android/branding/res")
                // Fork services (MihomoVpnService, ...): merged into upstream's manifest.
                maybeCreate(flavor + type.capitalize()).manifest.srcFile("$rootDir/quartz/android/engine-bridge/src/main/AndroidManifest.xml")
            }
        }
    }
}

// Upstream adds LeakCanary to debug builds, which puts a separate "Leaks" icon in the
// launcher. Quartz ships debug builds for now, so leave it out.
configurations.configureEach {
    exclude group: "com.squareup.leakcanary"
}

// Fork code (quartz/android/core, quartz/android/warp, ...) is compiled as part of the app rather than as separate
// Gradle modules, so it can use upstream's types (TunnelConfig, repositories, Koin, UI) directly.
// Each quartz/android/<name>/src/{main,test} adds its java, res and assets to the app's source sets.
android {
    sourceSets {
        ["core", "warp", "engine-mihomo", "engine-bridge", "importer", "clash-ui"].each { name ->
            def dir = "$rootDir/quartz/android/$name/src"
            main.kotlin.directories.add("$dir/main/java")
            main.res.directories.add("$dir/main/res")
            main.assets.directories.add("$dir/main/assets")
            test.kotlin.directories.add("$dir/test/java")
        }
    }
}

// mihomo engine: quartz/android/engines/mihomo (submodule, unpatched) + quartz/android/engine-mihomo/go (cgo/JNI wrapper),
// built into libmihomo.so per ABI with the NDK and Go on PATH. Skipped while the submodule
// commit and the wrapper are unchanged (a stamp next to the .so), so CI can restore the
// outputs from a cache keyed the same way. -PprebuiltEngines skips the build entirely and
// packages whatever is in build/generated/quartz/jniLibs.
def quartzNdkVersion = "29.0.14206865"
def mihomoAbis = [
    "arm64-v8a"  : [goarch: "arm64", goarm: "", clang: "aarch64-linux-android26-clang"],
    "armeabi-v7a": [goarch: "arm", goarm: "7", clang: "armv7a-linux-androideabi26-clang"],
]
def mihomoSrc = file("$rootDir/quartz/android/engines/mihomo")
def mihomoWrapper = file("$rootDir/quartz/android/engine-mihomo/go")
def mihomoJniLibs = layout.buildDirectory.dir("generated/quartz/jniLibs").get().asFile

def mihomoStamp = providers.provider {
    def commit = providers.exec {
        commandLine "git", "-C", mihomoSrc.path, "rev-parse", "HEAD"
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
    def wrapper = fileTree(mihomoWrapper).files.sort { it.name }
        .collect { it.name + ":" + it.bytes.encodeHex().toString().md5() }.join(",")
    commit + "|" + wrapper.md5()
}
def mihomoVersion = providers.provider {
    providers.exec {
        commandLine "git", "-C", mihomoSrc.path, "describe", "--tags", "--always"
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
}

def buildMihomo = tasks.register("buildMihomo") {
    description = "Builds libmihomo.so for every ABI (quartz/android/engines/mihomo + quartz/android/engine-mihomo/go)."
}
mihomoAbis.each { abi, target ->
    def outDir = new File(mihomoJniLibs, abi)
    def task = tasks.register("buildMihomo" + abi.replace("-", "").capitalize(), Exec) {
        onlyIf("prebuiltEngines not set") { !project.hasProperty("prebuiltEngines") }
        onlyIf("submodule or wrapper changed") {
            def stamp = new File(outDir, "libmihomo.stamp")
            !(new File(outDir, "libmihomo.so").exists() && stamp.exists() && stamp.text == mihomoStamp.get())
        }
        workingDir mihomoWrapper
        doFirst {
            def toolchain = new File(androidComponents.sdkComponents.sdkDirectory.get().asFile,
                "ndk/$quartzNdkVersion/toolchains/llvm/prebuilt/linux-x86_64/bin")
            if (!toolchain.exists()) {
                throw new GradleException("NDK $quartzNdkVersion not found: sdkmanager \"ndk;$quartzNdkVersion\"")
            }
            outDir.mkdirs()
            environment "CGO_ENABLED", "1"
            environment "GOOS", "android"
            environment "GOARCH", target.goarch
            if (target.goarm) environment "GOARM", target.goarm
            environment "CC", new File(toolchain, target.clang).path
        }
        commandLine "go", "build", "-trimpath", "-buildmode=c-shared", "-tags", "with_gvisor,cmfa",
            "-ldflags", "-s -w -buildid= -X github.com/metacubex/mihomo/constant.Version=${-> mihomoVersion.get()}",
            "-o", new File(outDir, "libmihomo.so").path, "."
        doLast {
            new File(outDir, "libmihomo.h").delete()
            new File(outDir, "libmihomo.stamp").text = mihomoStamp.get()
        }
    }
    buildMihomo.configure { dependsOn task }
}

// Host (Linux/macOS) build of the same wrapper, for JVM unit tests that check generated
// profiles against real mihomo: ./gradlew :app:buildMihomoHost, then tests pick it up.
def mihomoHostLib = layout.buildDirectory.file("quartz/host/libmihomo.so").get().asFile
tasks.register("buildMihomoHost", Exec) {
    description = "Builds libmihomo for this machine's JVM (unit tests only)."
    workingDir mihomoWrapper
    def javaHome = System.getProperty("java.home")
    def os = System.getProperty("os.name").toLowerCase().contains("mac") ? "darwin" : "linux"
    environment "CGO_ENABLED", "1"
    environment "CGO_CFLAGS", "-I$javaHome/include -I$javaHome/include/$os"
    commandLine "go", "build", "-buildmode=c-shared", "-tags", "with_gvisor,cmfa", "-o", mihomoHostLib.path, "."
    doLast { new File(mihomoHostLib.parentFile, "libmihomo.h").delete() }
}
tasks.withType(Test).configureEach {
    systemProperty "quartz.mihomo.hostLib", mihomoHostLib.path
}

android {
    sourceSets.main.jniLibs.directories.add(mihomoJniLibs.path)
    packaging.jniLibs.excludes.add("**/libmihomo.stamp")
    // Compress native libraries in the APK: libmihomo.so is ~60 MB per ABI uncompressed.
    // Android extracts them at install; a much smaller download matters more for sideloading.
    packaging.jniLibs.useLegacyPackaging = true
}
tasks.matching { it.name ==~ /merge.*JniLibFolders/ }.configureEach { dependsOn buildMihomo }

// Libraries only fork code uses.
dependencies {
    implementation "org.snakeyaml:snakeyaml-engine:2.10" // Clash/mihomo YAML (quartz/android/importer)
}

// Upstream bases this build is made from, for the in-app "Check upstream versions" (Info tab).
def quartzEngineVersions = new Properties()
file("$rootDir/quartz/android/engines/versions.properties").with { if (it.exists()) it.withInputStream { quartzEngineVersions.load(it) } }
def quartzGitTag = { String dir ->
    def pinned = quartzEngineVersions.getProperty(new File(dir).name)
    if (pinned) return pinned
    def path = file(dir)
    if (!new File(path, ".git").exists()) return ""
    providers.exec {
        commandLine "git", "-C", path.path, "describe", "--tags", "--abbrev=0"
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
}
def quartzDesktopBase = {
    def toml = file("$rootDir/desktop/gradle/libs.versions.toml")
    def match = toml.exists() ? (toml.text =~ /(?m)^app\s*=\s*"([^"]+)"/) : null
    match?.find() ? match.group(1) : ""
}
android {
    defaultConfig {
        buildConfigField "String", "QUARTZ_ANDROID_BASE", "\"${libs.versions.versionName.get()}\""
        buildConfigField "String", "QUARTZ_DESKTOP_BASE", "\"${quartzDesktopBase()}\""
        buildConfigField "String", "QUARTZ_MIHOMO_VERSION", "\"${quartzGitTag("$rootDir/quartz/android/engines/mihomo")}\""
        buildConfigField "String", "QUARTZ_OPENVPN3_VERSION", "\"${quartzGitTag("$rootDir/quartz/android/engines/openvpn3")}\""
    }
}
